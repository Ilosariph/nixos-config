---
# Ported from environment.systemPackages in modules/packages/base/base.nix.
base_packages:
  - vim
  - tree
  - wget
  - curl
  - htop
  - btop
  - bind-utils        # dig
  - psmisc            # killall
  - net-tools         # ifconfig
  - unzip
  - zip
  - udisks2
  - git
  - jq
  - ripgrep
  - fd-find
  - python3
  - python3-pip

# Installed best-effort: missing or renamed on some Fedora releases is not
# a reason to fail the whole run. Failures are reported at the end of the role.
base_optional_packages:
  - age              # sops-nix counterpart; `sops` itself is not in Fedora repos
  - uv
  - fastfetch

enable_rpmfusion: true
