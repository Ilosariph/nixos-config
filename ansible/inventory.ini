# Run this playbook on the machine it configures:
#
#   cd ansible
#   ansible-playbook site.yml -K
#
# `-K` prompts for the sudo password. Everything targets the local host through
# the `local` connection plugin, so no SSH server or key setup is needed.

[workstations]
localhost ansible_connection=local

[workstations:vars]
ansible_python_interpreter=/usr/bin/python3
